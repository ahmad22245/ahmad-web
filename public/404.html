<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Page Not Found — Ahmad Web & Automation</title>
  <meta name="robots" content="noindex, follow">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Pacifico&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      min-height: 100vh;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(135deg, #EEF0FF 0%, #D9DDFF 50%, #E9C9F4 100%);
      color: #15151C;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      position: relative;
      overflow-x: hidden;
    }
    .orb-glow {
      position: absolute;
      width: 450px;
      height: 450px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(124, 108, 240, 0.18) 0%, rgba(224, 86, 193, 0.12) 50%, transparent 70%);
      filter: blur(50px);
      z-index: 0;
      pointer-events: none;
    }
    .card-404 {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 520px;
      background: rgba(255, 255, 255, 0.78);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.95);
      border-radius: 28px;
      box-shadow: 0 20px 48px rgba(124, 108, 240, 0.10), 0 4px 12px rgba(0, 0, 0, 0.03);
      padding: 48px 36px;
    }
    /* Connected script logo */
    .brand-logo-wrap {
      display: inline-flex;
      align-items: baseline;
      justify-content: center;
      margin-bottom: 24px;
      text-decoration: none;
    }
    .brand-script-wrap {
      position: relative;
      display: inline-flex;
      align-items: center;
    }
    .brand-star-sparkle {
      position: absolute;
      top: -9px;
      left: 1px;
      width: 14px;
      height: 14px;
      filter: drop-shadow(0 0 4px rgba(255, 179, 107, 0.9));
    }
    .brand-script-text {
      font-family: 'Pacifico', cursive;
      font-size: 32px;
      line-height: 1;
      background: linear-gradient(135deg, #6C5CE7 0%, #E056C1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      padding-right: 3px;
    }
    .brand-sans-text {
      font-family: 'Inter', sans-serif;
      font-size: 20px;
      font-weight: 700;
      color: #15151C;
      letter-spacing: -0.01em;
      margin-left: 2px;
      transform: translateY(1px);
    }
    .brand-reg-mark {
      font-size: 9px;
      font-weight: 700;
      color: #7C6CF0;
      border: 1px solid #7C6CF0;
      border-radius: 50%;
      width: 13px;
      height: 13px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-left: 3px;
      transform: translateY(-8px);
    }
    .badge-code {
      display: inline-block;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #7C6CF0;
      background: rgba(124, 108, 240, 0.08);
      border: 1px solid rgba(124, 108, 240, 0.2);
      border-radius: 100px;
      padding: 6px 14px;
      margin-bottom: 16px;
    }
    .title-404 {
      font-size: clamp(1.8rem, 4vw, 2.3rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      color: #15151C;
      margin-bottom: 12px;
      line-height: 1.2;
    }
    .desc-404 {
      font-size: 1rem;
      color: #4B4B5C;
      line-height: 1.6;
      margin-bottom: 32px;
    }
    .actions-404 {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    @media (min-width: 480px) {
      .actions-404 {
        flex-direction: row;
        justify-content: center;
      }
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 13px 26px;
      border-radius: 100px;
      font-size: 0.94rem;
      font-weight: 600;
      text-decoration: none;
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }
    .btn-black {
      background: #15151C;
      color: #FFFFFF;
      box-shadow: 0 6px 20px rgba(21, 21, 28, 0.16);
    }
    .btn-black:hover {
      background: #2D2D3D;
      transform: translateY(-2px);
      box-shadow: 0 10px 26px rgba(21, 21, 28, 0.22);
    }
    .btn-outline {
      background: rgba(255, 255, 255, 0.85);
      color: #15151C;
      border: 1px solid rgba(21, 21, 28, 0.18);
    }
    .btn-outline:hover {
      background: #FFFFFF;
      border-color: #15151C;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div class="orb-glow" aria-hidden="true"></div>

  <div class="card-404">
    <!-- Brand Wordmark -->
    <a href="/" class="brand-logo-wrap" aria-label="Ahmad Web Home">
      <span class="brand-script-wrap">
        <svg class="brand-star-sparkle" viewBox="0 0 24 24" aria-hidden="true">
          <defs>
            <linearGradient id="starGrad404" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#FFD08A"/>
              <stop offset="100%" stop-color="#FF9A3D"/>
            </linearGradient>
          </defs>
          <path d="M12 0L14.8 8.8L24 12L14.8 15.2L12 24L9.2 15.2L0 12L9.2 8.8Z" fill="url(#starGrad404)"/>
        </svg>
        <span class="brand-script-text">Ahmad</span>
      </span>
      <span class="brand-sans-text">Web</span>
      <span class="brand-reg-mark" aria-hidden="true">R</span>
    </a>

    <div><span class="badge-code">Error 404</span></div>
    <h1 class="title-404">Page Not Found</h1>
    <p class="desc-404">The link you followed doesn't exist or has moved. Let's get you back to Ahmad's studio.</p>

    <div class="actions-404">
      <a href="/" class="btn btn-black">Back to Home</a>
      <a href="https://wa.me/923094206637" class="btn btn-outline" target="_blank" rel="noopener noreferrer">Message on WhatsApp</a>
    </div>
  </div>
</body>
</html>
